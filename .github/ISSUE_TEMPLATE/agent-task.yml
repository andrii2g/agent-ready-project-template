name: Agent task
description: Define a bounded, testable task suitable for an AI coding agent.
title: "[Task]: "
labels: ["agent-task", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Do not include secrets, personal data, or untrusted production credentials.
  - type: textarea
    id: objective
    attributes:
      label: Objective
      description: State the user-visible or operational outcome.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Provide observable, testable criteria.
      placeholder: |
        - [ ] Given ..., when ..., then ...
    validations:
      required: true
  - type: textarea
    id: non_goals
    attributes:
      label: Non-goals
      description: State adjacent work that must not be included.
  - type: textarea
    id: context
    attributes:
      label: Relevant context
      description: Link code, decisions, logs with secrets removed, or documentation.
  - type: textarea
    id: boundaries
    attributes:
      label: Allowed and prohibited changes
      description: Name paths, interfaces, dependencies, migrations, or operations that are in or out of bounds.
  - type: textarea
    id: validation
    attributes:
      label: Expected validation
      description: List exact commands or scenarios that should demonstrate completion.
  - type: dropdown
    id: risk
    attributes:
      label: Risk level
      options:
        - Low - isolated and reversible
        - Medium - multiple files or public behavior
        - High - security, data, migration, infrastructure, or irreversible effects
    validations:
      required: true
  - type: checkboxes
    id: decisions
    attributes:
      label: Human decisions
      options:
        - label: Production dependency change is approved or not required.
        - label: Public API or schema change is approved or not required.
        - label: Migration or destructive operation is approved or not required.
        - label: Deployment or release is explicitly outside agent execution.
