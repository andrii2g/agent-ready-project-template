name: Policy

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: policy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    name: Policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v6.3.0
        with:
          python-version: '3.13'
      - name: Verify repository policy
        run: python scripts/verify_repository.py
      - name: Verify synchronized agent skills
        run: python scripts/sync_agent_skills.py --check
